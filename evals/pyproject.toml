[project]
name = "quimioresponde-evals"
version = "0.1.0"
requires-python = ">=3.12"
# Las evals no dependen del paquete `api`: importan su código agregando `api/src`
# a sys.path (harness/__init__.py), por lo que declaran las dependencias que esos
# módulos necesitan al importarse.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.5.1",
    "google-genai>=1.0",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
]

[tool.uv]
package = false
